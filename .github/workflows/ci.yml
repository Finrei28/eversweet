name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    env:
      # Dummy values so Prisma can load the schema without a real database.
      # No live connection is made for `prisma generate`.
      DATABASE_URL: "postgresql://user:password@localhost:5432/db"
      DIRECT_URL: "postgresql://user:password@localhost:5432/db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
